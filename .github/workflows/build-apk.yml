name: Build APK

# Builds the universal release APK on GitHub's runners and uploads it as a
# workflow artifact. Pushing a tag named new-lumen-* also publishes a GitHub
# Release with the APK attached.
on:
  push:
    branches:
      - "arena/**"
    tags:
      - "new-lumen-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Runs the volume boost unit tests. It runs next to the APK build, so a test
  # failure is reported without blocking the APK.
  unit-tests:
    name: Volume boost unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run volume boost tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --tests "com.lumen.player.player.audio.*" --no-daemon --stacktrace 2>&1 | tee test-output.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volume-boost-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            test-output.log
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build universal release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Copy APK to a clear name
        run: cp app/build/outputs/apk/release/app-universal-release.apk "new-Lumen-26.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-Lumen-26
          path: new-Lumen-26.apk
          if-no-files-found: error
          retention-days: 30

      - name: Surface compiler errors as annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          lines = open("build-output.log", encoding="utf-8", errors="replace").read().splitlines()
          picked = []
          for i, line in enumerate(lines):
              if re.match(r"^e: |^w: .*\.kt|^ERROR|^Caused by|Execution failed|FAILED$|What went wrong", line):
                  picked.append(line.strip())
                  if "What went wrong" in line:
                      picked.extend(l.strip() for l in lines[i + 1:i + 3])
          print("error lines found:", len(picked))
          # GitHub shows at most 10 error annotations per step: pack the lines into them.
          chunks = [picked[k:k + 8] for k in range(0, len(picked), 8)][:9]
          for chunk in chunks:
              msg = " | ".join(chunk)[:1800].replace("%", "%25").replace("\r", "").replace("\n", " ")
              print(f"::error title=Build error::{msg}")
          if not picked:
              tail = " | ".join(l.strip() for l in lines[-25:])[:1800]
              print(f"::error title=Build tail::{tail}")
          PY

      - name: Publish GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/new-lumen-')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp new-Lumen-26.apk "new Lumen 26.apk"
          # Tag new-lumen-26 -> "new Lumen 26"; tag new-lumen-26-v2 -> "new Lumen 26 v2".
          SUFFIX="${GITHUB_REF_NAME#new-lumen-26}"
          SUFFIX="${SUFFIX#-}"
          TITLE="new Lumen 26"
          if [ -n "$SUFFIX" ]; then TITLE="new Lumen 26 ${SUFFIX}"; fi
          gh release create "$GITHUB_REF_NAME" "new Lumen 26.apk" \
            --title "$TITLE" \
            --notes "Universal release APK built from commit ${GITHUB_SHA:0:7}.

          New in this build:
          - Volume boost up to 200%. Turn it on in Settings > Volume > Activate boost, then choose the maximum (120% to 200%).
          - The video and music volume HUD shows the percentage, and a 100% marker when boost is on.
          - Settings > Volume > Boost status shows whether the boost is reaching the audio output.
          - Select all / deselect all when deleting, sharing or queuing videos in a folder or in the library.
          - Smoother circle animations on empty screens and onboarding. The seek ripple is a ring from the tapped side.
          - New default accent: light white. You can still pick another colour in Settings."

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log
          if-no-files-found: warn
          retention-days: 14
