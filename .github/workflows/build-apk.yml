name: Build APK

# Builds the universal release APK on GitHub's runners and uploads it as a
# workflow artifact. Triggered by pushes to arena/* branches or manually.
on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build universal release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Copy APK to a clear name
        run: cp app/build/outputs/apk/release/app-universal-release.apk "new-Lumen-26.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-Lumen-26
          path: new-Lumen-26.apk
          if-no-files-found: error
          retention-days: 30

      - name: Surface compiler errors as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |What went wrong|Execution failed|^> " build-output.log \
            | head -80 \
            | while IFS= read -r line; do echo "::error title=Build error::${line}"; done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log
          if-no-files-found: warn
          retention-days: 14
